name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install ruff mypy black pytest pytest-cov pre-commit
      - name: Lint
        run: |
          ruff check .
          black --check .
      - name: Type check
        run: mypy src
      - name: Tests
        run: pytest -q --cov=src
      - name: Pre-commit
        run: pre-commit run --all-files
